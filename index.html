<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2a6f7c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="课表打卡" />
  <title>课表打卡</title>
  <link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22%E8%AF%BE%E8%A1%A8%E6%89%93%E5%8D%A1%22%2C%22short_name%22%3A%22%E8%AF%BE%E8%A1%A8%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23f7f9fb%22%2C%22theme_color%22%3A%22%232a6f7c%22%7D" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=DM+Sans:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #1a2332;
      --muted: #5c6b7a;
      --line: #d8e0e8;
      --paper: #f3f6f8;
      --surface: #ffffff;
      --header: #243447;
      --accent: #2a6f7c;
      --accent-soft: #e4f1f3;
      --done: #2f7d4a;
      --done-bg: #e5f4ea;
      --danger: #8a3b2b;
      --c13: #d6ebf0;
      --c15: #e8edd8;
      --c18: #f0e4d8;
      --c110: #e0e4f0;
      --cmeet: #f0e8d4;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: "Noto Sans SC", "DM Sans", system-ui, sans-serif;
      color: var(--ink);
      background: var(--paper);
    }

    body {
      padding: 16px 14px calc(88px + var(--safe-bottom));
    }

    .wrap { max-width: 720px; margin: 0 auto; }

    .top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    h1 {
      margin: 0;
      font-size: 1.45rem;
      letter-spacing: 0.03em;
      color: var(--header);
    }

    .sub {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 0.86rem;
      line-height: 1.4;
    }

    .week-chip {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      padding: 8px 10px;
      border-radius: 12px;
      background: var(--accent-soft);
      border: 1px solid #c5dde2;
      color: var(--header);
      font-size: 0.88rem;
      font-weight: 600;
      line-height: 1.35;
    }

    .week-chip .week-nav {
      display: inline-flex;
      gap: 4px;
      flex: none;
    }

    .week-chip .week-nav button {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      border: 1px solid #b7ced4;
      background: #fff;
      color: var(--header);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      padding: 0;
    }

    .week-chip .week-text {
      flex: 1;
      min-width: 0;
      display: grid;
      gap: 2px;
    }

    .week-chip .muted {
      color: var(--muted);
      font-weight: 500;
      font-size: 0.8rem;
    }

    .week-chip.past {
      background: #eef1f4;
      border-color: var(--line);
    }

    .icon-btn {
      flex: none;
      width: 42px;
      height: 42px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--surface);
      font-size: 1.1rem;
      cursor: pointer;
    }

    .progress-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px 16px;
      margin-bottom: 14px;
    }

    .progress-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 8px;
    }

    .progress-row strong { font-size: 1.05rem; }
    .progress-row span { color: var(--muted); font-size: 0.85rem; }

    .bar {
      height: 8px;
      border-radius: 999px;
      background: #e7eef2;
      overflow: hidden;
    }

    .bar > i {
      display: block;
      height: 100%;
      width: 0%;
      background: var(--accent);
      border-radius: inherit;
      transition: width 0.25s ease;
    }

    .day-tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
      margin-bottom: 12px;
      scrollbar-width: none;
    }

    .day-tabs::-webkit-scrollbar { display: none; }

    .day-tab {
      flex: none;
      min-width: 46px;
      padding: 10px 0 8px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--surface);
      text-align: center;
      cursor: pointer;
      font: inherit;
    }

    .day-tab .d { display: block; font-weight: 700; font-size: 0.95rem; }
    .day-tab .n { display: block; margin-top: 2px; font-size: 0.72rem; color: var(--muted); }

    .day-tab.today { border-color: var(--accent); background: var(--accent-soft); }
    .day-tab.active {
      background: var(--header);
      border-color: var(--header);
      color: #fff;
    }
    .day-tab.active .n { color: rgba(255,255,255,0.72); }

    .class-list { display: grid; gap: 10px; }

    .class-card {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px 14px 14px 16px;
      text-align: left;
      cursor: pointer;
      font: inherit;
      color: inherit;
      transition: transform 0.12s ease, background 0.15s ease, border-color 0.15s ease;
      touch-action: manipulation;
    }

    .class-card:active { transform: scale(0.985); }

    .class-card.done {
      background: var(--done-bg);
      border-color: #b7d9c1;
    }

    .class-meta { min-width: 0; }
    .class-time {
      font-family: "DM Sans", sans-serif;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .class-name {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    .class-name.tint-1-3 { color: #1e4f5a; }
    .class-name.tint-1-5 { color: #3f4d22; }
    .class-name.tint-1-8 { color: #6a4020; }
    .class-name.tint-1-10 { color: #333a5c; }
    .class-name.tint-meet { color: #6a4f18; }

    .check {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 2px solid #c5d2db;
      display: grid;
      place-items: center;
      font-size: 1.2rem;
      font-weight: 700;
      color: transparent;
      background: #fff;
      transition: all 0.15s ease;
    }

    .class-card.done .check {
      background: var(--done);
      border-color: var(--done);
      color: #fff;
    }

    .empty-day {
      background: var(--surface);
      border: 1px dashed var(--line);
      border-radius: 16px;
      padding: 28px 16px;
      text-align: center;
      color: var(--muted);
    }

    .dock {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 10px 14px calc(10px + var(--safe-bottom));
      background: rgba(247, 249, 251, 0.92);
      backdrop-filter: blur(10px);
      border-top: 1px solid var(--line);
      display: flex;
      gap: 8px;
      justify-content: center;
      z-index: 20;
    }

    .dock button {
      font: inherit;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      border-radius: 999px;
      padding: 11px 14px;
      cursor: pointer;
      min-height: 44px;
    }

    .dock .primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .dock .danger { color: var(--danger); }

    .month-summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    .month-stat {
      background: #f7fafb;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 8px;
      text-align: center;
    }

    .month-stat b {
      display: block;
      font-size: 1.2rem;
      color: var(--header);
    }

    .month-stat span {
      display: block;
      margin-top: 2px;
      font-size: 0.75rem;
      color: var(--muted);
    }

    .month-stat.done b { color: var(--done); }
    .month-stat.miss b { color: var(--danger); }

    .month-filters {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .month-filters button {
      font: inherit;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 999px;
      padding: 7px 12px;
      cursor: pointer;
    }

    .month-filters button.active {
      background: var(--header);
      border-color: var(--header);
      color: #fff;
    }

    .month-list {
      display: grid;
      gap: 10px;
      max-height: min(62vh, 560px);
      overflow: auto;
      -webkit-overflow-scrolling: touch;
    }

    .month-day {
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
      background: #fff;
    }

    .month-day-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      background: #f2f5f8;
      font-weight: 600;
      font-size: 0.92rem;
    }

    .month-day-head .sub {
      margin: 0;
      font-weight: 500;
      font-size: 0.78rem;
      color: var(--muted);
    }

    .month-item {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: center;
      padding: 10px 12px;
      border-top: 1px solid var(--line);
    }

    .month-item .time {
      font-family: "DM Sans", sans-serif;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--muted);
    }

    .month-item .name {
      font-weight: 700;
      margin-top: 2px;
    }

    .status-pill {
      flex: none;
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 0.78rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .status-pill.done {
      background: var(--done-bg);
      color: var(--done);
    }

    .status-pill.miss {
      background: #f8e8e4;
      color: var(--danger);
    }

    .status-pill.pending {
      background: #eef3f6;
      color: var(--muted);
    }

    .status-pill.future {
      background: #f4f1ea;
      color: #7a6540;
    }

    .sheet {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 40;
      background: rgba(20, 28, 36, 0.42);
      padding: 18px 14px calc(18px + var(--safe-bottom));
      overflow: auto;
    }

    .sheet.open { display: block; }

    .sheet-panel {
      max-width: 720px;
      margin: 0 auto;
      background: var(--surface);
      border-radius: 18px;
      padding: 16px;
      border: 1px solid var(--line);
    }

    .sheet-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .sheet-head h2 { margin: 0; font-size: 1.1rem; }

    .tools {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }

    .tools button, .ghost-btn {
      font: inherit;
      border: 1px solid var(--line);
      background: #f7fafb;
      border-radius: 999px;
      padding: 8px 12px;
      cursor: pointer;
    }

    .board {
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 12px;
      -webkit-overflow-scrolling: touch;
    }

    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      min-width: 760px;
    }

    th, td {
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      text-align: center;
      vertical-align: middle;
    }

    th:last-child, td:last-child { border-right: none; }
    tr:last-child td { border-bottom: none; }

    thead th {
      background: var(--header);
      color: #f4f7fa;
      font-weight: 600;
      font-size: 0.85rem;
      padding: 10px 6px;
      position: sticky;
      top: 0;
      z-index: 2;
    }

    .time-cell {
      background: #f2f5f8;
      padding: 8px;
      text-align: left;
      white-space: nowrap;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .slot {
      min-height: 44px;
      margin: 3px;
      padding: 8px 4px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.88rem;
      outline: none;
    }

    .slot.empty { color: transparent; }
    .slot[contenteditable="true"]:focus {
      box-shadow: inset 0 0 0 2px var(--accent);
      background: #fff;
      color: var(--ink);
    }

    .code-1-3 { background: var(--c13); color: #1e4f5a; }
    .code-1-5 { background: var(--c15); color: #3f4d22; }
    .code-1-8 { background: var(--c18); color: #6a4020; }
    .code-1-10 { background: var(--c110); color: #333a5c; }
    .code-meet { background: var(--cmeet); color: #6a4f18; }
    .slot.done-mark {
      background: var(--done) !important;
      color: #fff !important;
      position: relative;
    }

    .hint {
      margin-top: 12px;
      color: var(--muted);
      font-size: 0.82rem;
      line-height: 1.5;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(76px + var(--safe-bottom));
      transform: translateX(-50%) translateY(12px);
      background: var(--header);
      color: #fff;
      padding: 10px 14px;
      border-radius: 999px;
      font-size: 0.86rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
      z-index: 50;
      max-width: 90vw;
      text-align: center;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (min-width: 860px) {
      body { padding: 24px 20px 40px; }
      .dock { display: none; }
      .desktop-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 14px 0;
      }
    }

    @media (max-width: 859px) {
      .desktop-actions { display: none; }
    }

    .desktop-actions button {
      font: inherit;
      border: 1px solid var(--line);
      background: var(--surface);
      border-radius: 999px;
      padding: 8px 14px;
      cursor: pointer;
    }

    .desktop-actions .primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .desktop-actions .danger { color: var(--danger); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div>
        <h1>课表打卡</h1>
        <p class="sub" id="subtitle">上完一点，变绿打勾 · 打卡按周自动保存</p>
        <div class="week-chip" id="weekRange" aria-live="polite">
          <div class="week-nav">
            <button type="button" id="btnPrevWeek" title="上一周" aria-label="上一周">‹</button>
            <button type="button" id="btnNextWeek" title="下一周" aria-label="下一周">›</button>
          </div>
          <div class="week-text">
            <span id="weekTitle">本周加载中…</span>
            <span class="muted" id="weekMeta"></span>
          </div>
        </div>
      </div>
      <button type="button" class="icon-btn" id="btnMore" title="更多" aria-label="更多">⋯</button>
    </div>

    <div class="progress-card">
      <div class="progress-row">
        <strong id="progressTitle">今日进度</strong>
        <span id="progressText">0 / 0</span>
      </div>
      <div class="bar"><i id="progressBar"></i></div>
    </div>

    <div class="day-tabs" id="dayTabs"></div>
    <div class="class-list" id="classList"></div>

    <div class="desktop-actions">
      <button type="button" class="primary" id="btnTodayDesk">回到今天</button>
      <button type="button" id="btnMonthDesk">按月查看</button>
      <button type="button" class="danger" id="btnClearDesk">清空本周打卡</button>
      <button type="button" id="btnEditDesk">编辑课表</button>
      <button type="button" id="btnPdfDesk">导出 PDF</button>
    </div>

    <p class="hint">
      用法：手机浏览器打开此页 →「添加到主屏幕/收藏」最方便。<br />
      打卡按周保存；可左右切周，或点「月报」按月看已上/未上。改课表请点右上角 ⋯。
    </p>
  </div>

  <div class="dock">
    <button type="button" class="primary" id="btnToday">今天</button>
    <button type="button" id="btnMonth">月报</button>
    <button type="button" class="danger" id="btnClear">清空本周</button>
    <button type="button" id="btnEdit">编辑课表</button>
  </div>

  <div class="sheet" id="monthSheet" role="dialog" aria-modal="true" aria-labelledby="monthSheetTitle">
    <div class="sheet-panel">
      <div class="sheet-head">
        <h2 id="monthSheetTitle">月度上课记录</h2>
        <button type="button" class="ghost-btn" id="btnCloseMonth">关闭</button>
      </div>
      <div class="week-chip" style="margin:0 0 12px;">
        <div class="week-nav">
          <button type="button" id="btnPrevMonth" title="上一月" aria-label="上一月">‹</button>
          <button type="button" id="btnNextMonth" title="下一月" aria-label="下一月">›</button>
        </div>
        <div class="week-text">
          <span id="monthTitle">加载中…</span>
          <span class="muted" id="monthMeta">根据课表 + 打卡统计</span>
        </div>
      </div>
      <div class="month-summary" id="monthSummary"></div>
      <div class="month-filters" id="monthFilters">
        <button type="button" data-filter="all" class="active">全部</button>
        <button type="button" data-filter="done">已上</button>
        <button type="button" data-filter="miss">未上</button>
        <button type="button" data-filter="pending">待上</button>
      </div>
      <div class="month-list" id="monthList"></div>
    </div>
  </div>

  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-panel">
      <div class="sheet-head">
        <h2 id="sheetTitle">编辑课表 / 更多</h2>
        <button type="button" class="ghost-btn" id="btnCloseSheet">关闭</button>
      </div>
      <div class="tools">
        <button type="button" id="btnSave">保存课表</button>
        <button type="button" id="btnPdf">导出 PDF</button>
        <button type="button" id="btnPrint">打印</button>
        <button type="button" id="btnExport">导出 JSON</button>
        <button type="button" id="btnReset" style="color:var(--danger)">恢复原始课表</button>
      </div>
      <div id="pdfRoot">
        <div class="pdf-title" style="display:none;margin:0 0 10px;font-weight:700;">周课表</div>
        <div class="board">
          <table id="schedule">
            <thead>
              <tr>
                <th>节次 / 时间</th>
                <th>一</th><th>二</th><th>三</th><th>四</th><th>五</th><th>六</th><th>日</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
      <p class="hint">长按或点格子可改课程名。打卡状态在主界面点课程卡片切换。</p>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.1/dist/html2pdf.bundle.min.js"></script>
  <script>
    const DAYS = ["一", "二", "三", "四", "五", "六", "日"];
    const DAY_FULL = { 一: "周一", 二: "周二", 三: "周三", 四: "周四", 五: "周五", 六: "周六", 日: "周日" };
    const SLOTS = [
      { id: "p1", period: "1", time: "08:30 – 09:10" },
      { id: "p2", period: "2", time: "09:20 – 10:00" },
      { id: "p3", period: "3", time: "10:20 – 11:10" },
      { id: "p4", period: "4", time: "11:20 – 12:00" },
      { id: "p5", period: "5", time: "13:40 – 14:20" },
      { id: "p6", period: "6", time: "14:30 – 15:10" },
      { id: "p7", period: "7", time: "15:20 – 16:00" },
      { id: "p8", period: "8", time: "16:10 – 16:40" },
      { id: "e1", period: "", time: "17:30 – 18:25" },
      { id: "e2", period: "", time: "18:35 – 19:30" },
      { id: "e3", period: "", time: "19:30 – 20:30" },
    ];

    const DEFAULT_GRID = {
      p1: { 一: "", 二: "1.3", 三: "1.5", 四: "", 五: "集备", 六: "1.3", 日: "" },
      p2: { 一: "", 二: "1.5", 三: "1.3", 四: "", 五: "", 六: "1.5", 日: "" },
      p3: { 一: "", 二: "", 三: "", 四: "", 五: "", 六: "", 日: "" },
      p4: { 一: "", 二: "", 三: "", 四: "", 五: "", 六: "", 日: "" },
      p5: { 一: "1.5", 二: "", 三: "", 四: "1.5", 五: "", 六: "", 日: "" },
      p6: { 一: "1.3", 二: "", 三: "", 四: "1.3", 五: "", 六: "", 日: "" },
      p7: { 一: "", 二: "", 三: "", 四: "", 五: "", 六: "", 日: "" },
      p8: { 一: "", 二: "1.10", 三: "", 四: "1.8", 五: "", 六: "", 日: "" },
      e1: { 一: "1.3", 二: "", 三: "", 四: "1.5", 五: "", 六: "", 日: "" },
      e2: { 一: "1.5", 二: "", 三: "", 四: "1.3", 五: "", 六: "", 日: "" },
      e3: { 一: "", 二: "", 三: "", 四: "", 五: "", 六: "", 日: "" },
    };

    const GRID_KEY = "weekly-class-schedule-v2";
    const DONE_KEY_OLD = "weekly-class-done-v1";
    const WEEK_KEY_OLD = "weekly-class-week-id-v1";
    const DONE_BY_WEEK_KEY = "weekly-class-done-by-week-v2";
    const MAX_WEEKS_KEEP = 52;

    function toast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.add("show");
      clearTimeout(toast._t);
      toast._t = setTimeout(() => el.classList.remove("show"), 1800);
    }

    function startOfWeek(date = new Date()) {
      const d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
      const day = (d.getDay() + 6) % 7;
      d.setDate(d.getDate() - day);
      return d;
    }

    function weekId(date = new Date()) {
      const d = startOfWeek(date);
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const dd = String(d.getDate()).padStart(2, "0");
      return y + "-" + m + "-" + dd;
    }

    function weekIdToDate(id) {
      const [y, m, d] = id.split("-").map(Number);
      return new Date(y, m - 1, d);
    }

    function shiftWeekId(id, deltaWeeks) {
      const d = weekIdToDate(id);
      d.setDate(d.getDate() + deltaWeeks * 7);
      return weekId(d);
    }

    function isoWeekNumber(date = new Date()) {
      const d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
      d.setDate(d.getDate() + 3 - ((d.getDay() + 6) % 7));
      const week1 = new Date(d.getFullYear(), 0, 4);
      return 1 + Math.round(((d - week1) / 86400000 - 3 + ((week1.getDay() + 6) % 7)) / 7);
    }

    function formatMd(date) {
      return (date.getMonth() + 1) + "月" + date.getDate() + "日";
    }

    function formatYmd(date) {
      return date.getFullYear() + "年" + formatMd(date);
    }

    function weekRangeText(weekStartId, now = new Date()) {
      const mon = weekIdToDate(weekStartId);
      const sun = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + 6);
      const weekNo = isoWeekNumber(mon);
      const sameYear = mon.getFullYear() === sun.getFullYear();
      const sameMonth = sameYear && mon.getMonth() === sun.getMonth();
      const endText = sameMonth
        ? sun.getDate() + "日"
        : sameYear
          ? formatMd(sun)
          : formatYmd(sun);
      const isCurrent = weekStartId === weekId(now);
      const prefix = isCurrent ? "本周" : "第" + weekNo + "周";
      return {
        title: prefix + " " + formatYmd(mon) + " – " + endText,
        meta: mon.getFullYear() + "年第" + weekNo + "周" +
          (isCurrent ? " · 今天" + formatMd(now) + "（" + DAY_FULL[todayDayLabel()] + "）" : " · 历史记录可查看/补打"),
        isCurrent,
      };
    }

    function updateWeekLabel() {
      const info = weekRangeText(viewWeekId, new Date());
      const chip = document.getElementById("weekRange");
      chip.classList.toggle("past", !info.isCurrent);
      document.getElementById("weekTitle").textContent = info.title;
      document.getElementById("weekMeta").textContent = info.meta;
      document.getElementById("btnNextWeek").disabled = viewWeekId >= weekId();
      document.getElementById("subtitle").textContent =
        "上完一点，变绿打勾 · 打卡按周自动保存";
    }

    function todayDayLabel() {
      return DAYS[(new Date().getDay() + 6) % 7];
    }

    function cellKey(slotId, day) {
      return slotId + "|" + day;
    }

    function classFor(value) {
      const v = (value || "").trim();
      if (!v) return "empty";
      if (v === "1.3") return "code-1-3";
      if (v === "1.5") return "code-1-5";
      if (v === "1.8") return "code-1-8";
      if (v === "1.10" || v === "1.1.0") return "code-1-10";
      if (v.includes("集备") || v.includes("集体")) return "code-meet";
      return "";
    }

    function tintFor(value) {
      const c = classFor(value);
      return c.replace("code-", "tint-");
    }

    function loadGrid() {
      try {
        const raw = localStorage.getItem(GRID_KEY);
        if (!raw) return structuredClone(DEFAULT_GRID);
        const parsed = JSON.parse(raw);
        const merged = structuredClone(DEFAULT_GRID);
        for (const slot of SLOTS) {
          merged[slot.id] = { ...merged[slot.id], ...(parsed[slot.id] || {}) };
        }
        return merged;
      } catch {
        return structuredClone(DEFAULT_GRID);
      }
    }

    function loadDoneByWeek() {
      try {
        const raw = localStorage.getItem(DONE_BY_WEEK_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && typeof parsed === "object" && !Array.isArray(parsed)) return parsed;
        }
      } catch { /* migrate below */ }

      // 迁移旧版：整周共用一份打卡 → 归到当时那一周
      try {
        const oldDone = JSON.parse(localStorage.getItem(DONE_KEY_OLD) || "null");
        const oldWeek = localStorage.getItem(WEEK_KEY_OLD) || weekId();
        if (oldDone && typeof oldDone === "object" && Object.keys(oldDone).length) {
          const migrated = { [oldWeek]: oldDone };
          localStorage.setItem(DONE_BY_WEEK_KEY, JSON.stringify(migrated));
          return migrated;
        }
      } catch { /* ignore */ }
      return {};
    }

    function pruneDoneByWeek(store) {
      const ids = Object.keys(store).sort();
      if (ids.length <= MAX_WEEKS_KEEP) return store;
      const keep = ids.slice(-MAX_WEEKS_KEEP);
      const next = {};
      for (const id of keep) next[id] = store[id];
      return next;
    }

    function saveGrid() {
      localStorage.setItem(GRID_KEY, JSON.stringify(grid));
    }

    function getWeekDone(week = viewWeekId) {
      if (!doneByWeek[week] || typeof doneByWeek[week] !== "object") {
        doneByWeek[week] = {};
      }
      return doneByWeek[week];
    }

    function saveDoneByWeek() {
      doneByWeek = pruneDoneByWeek(doneByWeek);
      localStorage.setItem(DONE_BY_WEEK_KEY, JSON.stringify(doneByWeek));
    }

    function ensureCurrentWeekBucket() {
      const nowWeek = weekId();
      if (!doneByWeek[nowWeek]) doneByWeek[nowWeek] = {};
      // 不再清空旧周，只确保本周桶存在
      return nowWeek;
    }

    let grid = loadGrid();
    let doneByWeek = loadDoneByWeek();
    let viewWeekId = weekId();
    let selectedDay = todayDayLabel();
    const nowInit = new Date();
    let viewMonth = { y: nowInit.getFullYear(), m: nowInit.getMonth() }; // 0-based month
    let monthFilter = "all";
    ensureCurrentWeekBucket();
    saveDoneByWeek();

    function coursesOf(day) {
      return SLOTS
        .map((slot) => {
          const name = (grid[slot.id]?.[day] || "").trim();
          if (!name) return null;
          return {
            slotId: slot.id,
            period: slot.period,
            time: slot.time,
            name,
            key: cellKey(slot.id, day),
          };
        })
        .filter(Boolean);
    }

    function countDone(list) {
      const done = getWeekDone();
      return list.filter((c) => done[c.key]).length;
    }

    function weekTotalStats(week = viewWeekId) {
      let total = 0;
      let finished = 0;
      const done = getWeekDone(week);
      for (const day of DAYS) {
        const list = coursesOf(day);
        total += list.length;
        finished += list.filter((c) => done[c.key]).length;
      }
      return { total, finished };
    }

    function updateProgress() {
      const list = coursesOf(selectedDay);
      const n = list.length;
      const d = countDone(list);
      const isCurrentWeek = viewWeekId === weekId();
      const isToday = isCurrentWeek && selectedDay === todayDayLabel();
      document.getElementById("progressTitle").textContent = isToday
        ? "今日进度"
        : DAY_FULL[selectedDay] + "进度";
      const weekStats = weekTotalStats();
      const dayText = n ? d + " / " + n + " 节" : "无课";
      document.getElementById("progressText").textContent =
        dayText + " · 当周合计 " + weekStats.finished + "/" + weekStats.total;
      document.getElementById("progressBar").style.width = (n ? Math.round((d / n) * 100) : 0) + "%";
    }

    function renderTabs() {
      const tabs = document.getElementById("dayTabs");
      tabs.innerHTML = "";
      const isCurrentWeek = viewWeekId === weekId();
      const today = todayDayLabel();
      for (const day of DAYS) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "day-tab" +
          (day === selectedDay ? " active" : "") +
          (isCurrentWeek && day === today ? " today" : "");
        const list = coursesOf(day);
        const d = countDone(list);
        btn.innerHTML =
          '<span class="d">' + day + "</span>" +
          '<span class="n">' + (list.length ? d + "/" + list.length : "休") + "</span>";
        btn.addEventListener("click", () => {
          selectedDay = day;
          render();
        });
        tabs.appendChild(btn);
      }
    }

    function toggleDone(key) {
      const done = getWeekDone();
      if (done[key]) delete done[key];
      else done[key] = Date.now();
      saveDoneByWeek();
      if (navigator.vibrate) navigator.vibrate(12);
      render();
    }

    function renderList() {
      const root = document.getElementById("classList");
      const list = coursesOf(selectedDay);
      const done = getWeekDone();
      root.innerHTML = "";
      if (!list.length) {
        root.innerHTML = '<div class="empty-day">这一天没有安排课程</div>';
        return;
      }
      for (const item of list) {
        const isDone = !!done[item.key];
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "class-card" + (isDone ? " done" : "");
        const period = item.period ? "第" + item.period + "节 · " : "";
        btn.innerHTML =
          '<div class="class-meta">' +
            '<div class="class-time">' + period + item.time + "</div>" +
            '<div class="class-name ' + tintFor(item.name) + '">' + escapeHtml(item.name) + "</div>" +
          "</div>" +
          '<div class="check" aria-hidden="true">✓</div>';
        btn.setAttribute("aria-pressed", isDone ? "true" : "false");
        btn.addEventListener("click", () => toggleDone(item.key));
        root.appendChild(btn);
      }
    }

    function escapeHtml(s) {
      return String(s)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function paintSlot(el) {
      const value = el.textContent.trim();
      const key = cellKey(el.dataset.slot, el.dataset.day);
      const done = getWeekDone();
      el.className = "slot " + classFor(value);
      if (!value) el.classList.add("empty");
      if (value && done[key]) {
        el.classList.add("done-mark");
        if (!el.textContent.includes("✓")) el.textContent = value + " ✓";
      }
    }

    function renderTable() {
      const tbody = document.querySelector("#schedule tbody");
      tbody.innerHTML = "";
      for (const slot of SLOTS) {
        const tr = document.createElement("tr");
        const timeTd = document.createElement("td");
        timeTd.className = "time-cell";
        timeTd.textContent = (slot.period ? slot.period + " " : "") + slot.time;
        tr.appendChild(timeTd);
        for (const day of DAYS) {
          const td = document.createElement("td");
          const cell = document.createElement("div");
          cell.contentEditable = "true";
          cell.spellcheck = false;
          cell.dataset.slot = slot.id;
          cell.dataset.day = day;
          cell.textContent = grid[slot.id]?.[day] || "";
          paintSlot(cell);
          cell.addEventListener("input", () => {
            const raw = cell.textContent.replace(/\s*✓\s*$/, "").trim();
            grid[slot.id][day] = raw;
            paintSlot(cell);
          });
          cell.addEventListener("blur", () => {
            const raw = cell.textContent.replace(/\s*✓\s*$/, "").trim();
            grid[slot.id][day] = raw;
            cell.textContent = raw;
            paintSlot(cell);
          });
          td.appendChild(cell);
          tr.appendChild(td);
        }
        tbody.appendChild(tr);
      }
    }

    function render() {
      updateWeekLabel();
      renderTabs();
      renderList();
      updateProgress();
      if (document.getElementById("sheet").classList.contains("open")) renderTable();
    }

    function clearWeekDone(ask = true) {
      const label = viewWeekId === weekId() ? "本周" : "当前查看周";
      if (ask && !confirm("清空" + label + "所有打勾？其他周的记录会保留，课表内容不变。")) return;
      doneByWeek[viewWeekId] = {};
      saveDoneByWeek();
      render();
      toast(label + "打卡已清空");
    }

    function goToday() {
      viewWeekId = weekId();
      ensureCurrentWeekBucket();
      selectedDay = todayDayLabel();
      render();
      toast("已回到今天");
    }

    function shiftViewWeek(delta) {
      const next = shiftWeekId(viewWeekId, delta);
      if (delta > 0 && next > weekId()) return;
      viewWeekId = next;
      if (!doneByWeek[viewWeekId]) doneByWeek[viewWeekId] = {};
      if (viewWeekId === weekId()) selectedDay = todayDayLabel();
      else selectedDay = "一";
      render();
    }

    function openSheet() {
      document.getElementById("sheet").classList.add("open");
      renderTable();
    }

    function closeSheet() {
      document.getElementById("sheet").classList.remove("open");
      render();
    }

    function dayLabelFromDate(date) {
      return DAYS[(date.getDay() + 6) % 7];
    }

    function ymdKey(date) {
      return date.getFullYear() + "-" +
        String(date.getMonth() + 1).padStart(2, "0") + "-" +
        String(date.getDate()).padStart(2, "0");
    }

    function startOfDay(date) {
      return new Date(date.getFullYear(), date.getMonth(), date.getDate());
    }

    function classStatus(date, doneFlag) {
      if (doneFlag) return "done";
      const today = startOfDay(new Date());
      const d = startOfDay(date);
      if (d.getTime() > today.getTime()) return "future";
      if (d.getTime() === today.getTime()) return "pending";
      return "miss";
    }

    function statusLabel(status) {
      return ({
        done: "已上",
        miss: "未上",
        pending: "待上",
        future: "未到",
      })[status] || status;
    }

    function buildMonthRecords(y, m) {
      const daysInMonth = new Date(y, m + 1, 0).getDate();
      const days = [];
      let done = 0, miss = 0, pending = 0, future = 0, total = 0;

      for (let day = 1; day <= daysInMonth; day++) {
        const date = new Date(y, m, day);
        const label = dayLabelFromDate(date);
        const wId = weekId(date);
        const weekDone = doneByWeek[wId] || {};
        const items = [];

        for (const slot of SLOTS) {
          const name = (grid[slot.id]?.[label] || "").trim();
          if (!name) continue;
          const key = cellKey(slot.id, label);
          const status = classStatus(date, !!weekDone[key]);
          total += 1;
          if (status === "done") done += 1;
          else if (status === "miss") miss += 1;
          else if (status === "pending") pending += 1;
          else future += 1;

          items.push({
            slotId: slot.id,
            period: slot.period,
            time: slot.time,
            name,
            status,
            key,
            weekId: wId,
            dayLabel: label,
          });
        }

        if (!items.length) continue;
        const filtered = items.filter((it) => {
          if (monthFilter === "all") return true;
          if (monthFilter === "done") return it.status === "done";
          if (monthFilter === "miss") return it.status === "miss";
          if (monthFilter === "pending") return it.status === "pending" || it.status === "future";
          return true;
        });
        if (!filtered.length) continue;

        days.push({
          date,
          label,
          title: formatMd(date) + " · " + DAY_FULL[label],
          items: filtered,
          doneCount: items.filter((i) => i.status === "done").length,
          totalCount: items.length,
        });
      }

      return { days, stats: { total, done, miss, pending, future } };
    }

    function renderMonthView() {
      const { y, m } = viewMonth;
      document.getElementById("monthTitle").textContent = y + "年" + (m + 1) + "月";
      const data = buildMonthRecords(y, m);
      const s = data.stats;
      document.getElementById("monthMeta").textContent =
        "共 " + s.total + " 节安排 · 已上 " + s.done + " · 未上 " + s.miss;

      document.getElementById("monthSummary").innerHTML =
        '<div class="month-stat done"><b>' + s.done + '</b><span>已上</span></div>' +
        '<div class="month-stat miss"><b>' + s.miss + '</b><span>未上</span></div>' +
        '<div class="month-stat"><b>' + (s.pending + s.future) + '</b><span>待上/未到</span></div>';

      document.querySelectorAll("#monthFilters button").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.filter === monthFilter);
      });

      const list = document.getElementById("monthList");
      if (!data.days.length) {
        list.innerHTML = '<div class="empty-day">这个月没有可显示的课程记录</div>';
        return;
      }

      list.innerHTML = data.days.map((day) => {
        const headRight = day.doneCount + "/" + day.totalCount + " 已上";
        const itemsHtml = day.items.map((it) => {
          const period = it.period ? "第" + it.period + "节 · " : "";
          return (
            '<div class="month-item">' +
              '<div>' +
                '<div class="time">' + period + escapeHtml(it.time) + '</div>' +
                '<div class="name ' + tintFor(it.name) + '">' + escapeHtml(it.name) + '</div>' +
              '</div>' +
              '<span class="status-pill ' + it.status + '">' + statusLabel(it.status) + '</span>' +
            '</div>'
          );
        }).join("");
        return (
          '<section class="month-day">' +
            '<div class="month-day-head">' +
              '<div>' + escapeHtml(day.title) + '<p class="sub">' + ymdKey(day.date) + '</p></div>' +
              '<span class="sub">' + headRight + '</span>' +
            '</div>' +
            itemsHtml +
          '</section>'
        );
      }).join("");
    }

    function openMonthSheet() {
      const now = new Date();
      viewMonth = { y: now.getFullYear(), m: now.getMonth() };
      monthFilter = "all";
      document.getElementById("monthSheet").classList.add("open");
      renderMonthView();
    }

    function closeMonthSheet() {
      document.getElementById("monthSheet").classList.remove("open");
    }

    function shiftMonth(delta) {
      const d = new Date(viewMonth.y, viewMonth.m + delta, 1);
      viewMonth = { y: d.getFullYear(), m: d.getMonth() };
      renderMonthView();
    }

    function saveSchedule() {
      document.querySelectorAll("#schedule .slot").forEach((el) => {
        const raw = el.textContent.replace(/\s*✓\s*$/, "").trim();
        grid[el.dataset.slot][el.dataset.day] = raw;
      });
      saveGrid();
      toast("课表已保存");
      render();
    }

    function resetSchedule() {
      if (!confirm("恢复为最初识别的课表？各周打卡记录会保留。")) return;
      grid = structuredClone(DEFAULT_GRID);
      saveGrid();
      render();
      toast("已恢复原始课表");
    }

    function exportJson() {
      const blob = new Blob([JSON.stringify({
        slots: SLOTS,
        days: DAYS,
        grid,
        doneByWeek,
        viewWeekId,
        exportedAt: new Date().toISOString(),
      }, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "class-schedule.json";
      a.click();
      URL.revokeObjectURL(a.href);
      toast("已导出 JSON（含各周打卡）");
    }

    async function exportPdf() {
      if (typeof html2pdf === "undefined") {
        toast("PDF 库加载失败，可改用打印");
        return;
      }
      openSheet();
      await new Promise((r) => setTimeout(r, 50));
      const root = document.getElementById("pdfRoot");
      const title = root.querySelector(".pdf-title");
      title.style.display = "block";
      document.querySelectorAll("#schedule .slot").forEach((el) => el.contentEditable = "false");
      try {
        const stamp = new Date();
        const name =
          "周课表-" +
          stamp.getFullYear() +
          String(stamp.getMonth() + 1).padStart(2, "0") +
          String(stamp.getDate()).padStart(2, "0") +
          ".pdf";
        await html2pdf()
          .set({
            margin: [10, 8, 10, 8],
            filename: name,
            image: { type: "jpeg", quality: 0.98 },
            html2canvas: { scale: 2, useCORS: true, backgroundColor: "#ffffff", logging: false },
            jsPDF: { unit: "mm", format: "a4", orientation: "landscape" },
            pagebreak: { mode: ["avoid-all"] },
          })
          .from(root)
          .save();
        toast("已导出 PDF");
      } catch (e) {
        console.error(e);
        toast("导出失败，试试打印");
      } finally {
        title.style.display = "none";
        document.querySelectorAll("#schedule .slot").forEach((el) => el.contentEditable = "true");
      }
    }

    document.getElementById("btnToday").addEventListener("click", goToday);
    document.getElementById("btnTodayDesk").addEventListener("click", goToday);
    document.getElementById("btnMonth").addEventListener("click", openMonthSheet);
    document.getElementById("btnMonthDesk").addEventListener("click", openMonthSheet);
    document.getElementById("btnCloseMonth").addEventListener("click", closeMonthSheet);
    document.getElementById("btnPrevMonth").addEventListener("click", () => shiftMonth(-1));
    document.getElementById("btnNextMonth").addEventListener("click", () => shiftMonth(1));
    document.getElementById("monthSheet").addEventListener("click", (e) => {
      if (e.target.id === "monthSheet") closeMonthSheet();
    });
    document.getElementById("monthFilters").addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-filter]");
      if (!btn) return;
      monthFilter = btn.dataset.filter;
      renderMonthView();
    });
    document.getElementById("btnClear").addEventListener("click", () => clearWeekDone(true));
    document.getElementById("btnClearDesk").addEventListener("click", () => clearWeekDone(true));
    document.getElementById("btnPrevWeek").addEventListener("click", () => shiftViewWeek(-1));
    document.getElementById("btnNextWeek").addEventListener("click", () => shiftViewWeek(1));
    document.getElementById("btnEdit").addEventListener("click", openSheet);
    document.getElementById("btnEditDesk").addEventListener("click", openSheet);
    document.getElementById("btnMore").addEventListener("click", openSheet);
    document.getElementById("btnCloseSheet").addEventListener("click", closeSheet);
    document.getElementById("sheet").addEventListener("click", (e) => {
      if (e.target.id === "sheet") closeSheet();
    });
    document.getElementById("btnSave").addEventListener("click", saveSchedule);
    document.getElementById("btnPdf").addEventListener("click", exportPdf);
    document.getElementById("btnPdfDesk").addEventListener("click", exportPdf);
    document.getElementById("btnPrint").addEventListener("click", () => window.print());
    document.getElementById("btnExport").addEventListener("click", exportJson);
    document.getElementById("btnReset").addEventListener("click", resetSchedule);

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState !== "visible") return;
      const prev = viewWeekId;
      const nowWeek = ensureCurrentWeekBucket();
      saveDoneByWeek();
      if (prev === shiftWeekId(nowWeek, -1) || prev === nowWeek) {
        viewWeekId = nowWeek;
        selectedDay = todayDayLabel();
        if (prev !== nowWeek) toast("已进入新的一周，往周记录仍保留");
      }
      render();
    });

    render();
    toast("打卡已按周保存，可切换查看往周");
  </script>
</body>
</html>
